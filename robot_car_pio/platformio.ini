; ============================================================
; PlatformIO Configuration — Robot Car Controller
; Hardware: ESP32-S3 + L298N Motor Driver + Dual DC Motors
; ============================================================

[env:esp32-s3-robot]
platform      = espressif32
board         = esp32-s3-devkitc-1
framework     = arduino

; Monitor & upload settings
monitor_speed = 115200
upload_speed  = 921600

; Libraries
lib_deps =
    bblanchon/ArduinoJson @ ^7.3.1

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

