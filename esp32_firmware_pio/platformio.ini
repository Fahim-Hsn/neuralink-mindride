; ============================================================
; PlatformIO Configuration — ESP32-S3 EEG Firmware
; Hardware: AD8232 + ADS1115 + ESP32-S3 N16R8
; ============================================================

[env:esp32-s3-n16r8]
platform      = espressif32
board         = esp32-s3-devkitc-1
framework     = arduino

; ESP32-S3 N16R8 specific — 16MB Flash, 8MB PSRAM (OPI)
board_build.flash_size    = 16MB
board_build.psram_type    = opi
board_upload.flash_size   = 16MB

; Serial monitor
monitor_speed  = 115200
upload_speed   = 921600

; Libraries
lib_deps =
    adafruit/Adafruit ADS1X15 @ ^2.5.0
    bblanchon/ArduinoJson    @ ^7.3.1
    olikraus/U8g2            @ ^2.36.2

; Build flags
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1   ; USB Serial on boot (no extra driver needed)
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

